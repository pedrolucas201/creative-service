services:
  api:
    build: .
    command: ["/bin/api"]
    ports: ["8080:8080"]
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      META_BASE_URL: "https://graph.facebook.com"
      META_API_VERSION: "v24.0"
      HTTP_TIMEOUT: "45s"
      MAX_CONCURRENCY: "6"
      TOKEN_FRANCISCO: ${TOKEN_FRANCISCO}
      TOKEN_CONTIGENCIA01: ${TOKEN_CONTIGENCIA01}
      # Storage provider: "s3" ou "gcs"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      # AWS S3 (se STORAGE_PROVIDER=s3)
      DATABASE_URL: ${DATABASE_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # GCP (se STORAGE_PROVIDER=gcs)
      GCS_BUCKET: ${GCS_BUCKET}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON}

# PostgreSQL removido conforme pedido do chefe
# Agora usa Cloud SQL em produção